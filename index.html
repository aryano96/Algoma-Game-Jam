<script>
'use strict';
/* =====================================================================
   PERENNIAL  -  a Four Seasons game for the ThunderHacks 2026 Algoma Game Jam
   One tree is shade in summer, food in fall and fire in winter.
   All art is drawn in code. All audio is synthesized in code. No libraries.
   ===================================================================== */

// ---------------------------------------------------------------- constants
const W = 960, H = 540;
const YEARS = 3;
const CAP = 6; // a basket holds 6 fruit, your arms hold 6 logs
const SEASON_NAMES = ['SPRING', 'SUMMER', 'FALL', 'WINTER'];
const PLAY = { x0: 34, y0: 74, x1: 926, y1: 512 };
const POND = { x: 178, y: 345, rx: 112, ry: 72 };
const CABIN = { x0: 420, x1: 540, y0: 182, y1: 262 };
const PORCH = { x0: 418, x1: 542, y0: 262, y1: 300 };
const HEARTH = { x: 480, y: 336 };
const KENNEL = { x: 594, y: 252, need: 4 }; // the dog house plot, east of the cabin
const SUMMER_BONUS = 10; // summer lasts 10 seconds longer than the other seasons
const CAT_SPOT = { x: 446, y: 292, perch: 258 }; // the cat walks to the porch, then hops up onto the red porch beam (top edge at y 258)
const JAR = { fill: 8, open: 10, r: 95 }; // sun jar: seconds of sun to fill it, seconds of summer it holds, radius of its glow
const DIFF = {
  gentle: { season: 52, heat: 0.6, thirst: 0.6, cold: 0.6, hunger: 0.65, wolves: 0.6, fruit: 1.35, burn: 0.75 },
  normal: { season: 42, heat: 1.0, thirst: 0.7, cold: 1.0, hunger: 1.0, wolves: 1.0, fruit: 1.0, burn: 1.0 },
  hard:   { season: 36, heat: 1.3, thirst: 1.3, cold: 1.25, hunger: 1.25, wolves: 1.45, fruit: 0.8, burn: 1.2 }
};

// ---------------------------------------------------------------- utilities
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const hexCache = {};
function hexRGB(h) {
  if (hexCache[h]) return hexCache[h];
  const s = h.replace('#', '');
  return (hexCache[h] = [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)]);
}
function mixHex(a, b, t) {
  const A = hexRGB(a), B = hexRGB(b);
  return 'rgb(' + ((A[0] + (B[0] - A[0]) * t) | 0) + ',' + ((A[1] + (B[1] - A[1]) * t) | 0) + ',' + ((A[2] + (B[2] - A[2]) * t) | 0) + ')';
}
function rgba(h, a) { const c = hexRGB(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// ---------------------------------------------------------------- settings
const DEFAULT_KEYS = {
  up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
  action: ['Space', 'KeyE'], eat: ['KeyQ', 'KeyF'], pause: ['Escape', 'KeyP']
};
const settings = Object.assign({
  difficulty: 'normal', colorblind: false, hints: 'auto', reduceMotion: false, music: 6, sfx: 8,
  keys: JSON.parse(JSON.stringify(DEFAULT_KEYS))
}, load('perennial.settings', {}));
for (const k in DEFAULT_KEYS) if (!settings.keys[k]) settings.keys[k] = DEFAULT_KEYS[k].slice();
try { if (matchMedia('(prefers-reduced-motion: reduce)').matches && load('perennial.settings', null) === null) settings.reduceMotion = true; } catch (e) {}
function saveSettings() { store('perennial.settings', settings); }
let best = load('perennial.best', 0);

function keyLabel(code) {
  if (!code) return '?';
  const map = { ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', Space: 'Space', Escape: 'Esc', Enter: 'Enter',
    ShiftLeft: 'Shift', ShiftRight: 'Shift', ControlLeft: 'Ctrl', ControlRight: 'Ctrl', AltLeft: 'Alt', AltRight: 'Alt',
    Backspace: '⌫', Tab: 'Tab', Slash: '/', Period: '.', Comma: ',', Semicolon: ';', Quote: "'", BracketLeft: '[', BracketRight: ']',
    Minus: '-', Equal: '=', Backquote: '`', Backslash: '\\' };
  if (map[code]) return map[code];
  if (code.startsWith('Key')) return code.slice(3);
  if (code.startsWith('Digit')) return code.slice(5);
  if (code.startsWith('Numpad')) return 'N' + code.slice(6);
  return code.length > 6 ? code.slice(0, 6) : code;
}

// ---------------------------------------------------------------- palettes
// One flat "paper diorama" style. Every season shares shapes; only the palette and the rules change.
const PAL = [
  { ground: '#a5d784', ground2: '#8cc56c', leaf: '#5db85b', leaf2: '#3d9448', trunk: '#7a5235', water: '#67c2e4', water2: '#b2e6f5',
    accent: '#f7a8c8', accent2: '#fff1a1', border: '#3f8a4a', border2: '#2c6a39', dirt: '#b39066', roof: '#a8483a' },
  { ground: '#dccf72', ground2: '#c9b95a', leaf: '#3f9c4a', leaf2: '#2b7a37', trunk: '#6e4a2e', water: '#3cafd8', water2: '#97dcf1',
    accent: '#ffd24a', accent2: '#ff9f3a', border: '#367f40', border2: '#24602e', dirt: '#b48d55', roof: '#a8483a' },
  { ground: '#cf9e5f', ground2: '#bb894b', leaf: '#e8742d', leaf2: '#c24f1f', trunk: '#5e3d27', water: '#4f8faa', water2: '#89bacd',
    accent: '#f2b33d', accent2: '#b8462a', border: '#a5552b', border2: '#6c3a22', dirt: '#9a7046', roof: '#8e3b30' },
  { ground: '#e9eff5', ground2: '#d2deea', leaf: '#cfdde8', leaf2: '#9fb3c4', trunk: '#5a4636', water: '#c3e5f2', water2: '#eef9fd',
    accent: '#8fb7d8', accent2: '#ffffff', border: '#4c6a73', border2: '#34505a', dirt: '#c9cfd6', roof: '#eef4f8' }
];
function UIC() {
  return settings.colorblind ? {
    health: '#3a8fd6', heat: '#E69F00', cold: '#56B4E9', danger: '#D55E00', ok: '#009E73', fruit: '#f08c00', fruitHi: '#ffd28a',
    season: ['#CC79A7', '#F0E442', '#D55E00', '#56B4E9'], fuel: '#E69F00'
  } : {
    health: '#e5484d', heat: '#ff9f3a', cold: '#7cc8f0', danger: '#ff5a4a', ok: '#7fd06b', fruit: '#e23b3b', fruitHi: '#ff9a8a',
    season: ['#86d26f', '#ffd24a', '#e8742d', '#a9d8f2'], fuel: '#ffb347'
  };
}

// ---------------------------------------------------------------- canvas
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth || innerWidth, h = cv.clientHeight || innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  scale = Math.min(w / W, h / H); offX = (w - W * scale) / 2; offY = (h - H * scale) / 2;
}
addEventListener('resize', resize);
resize();
const fog = document.createElement('canvas'); fog.width = W / 2; fog.height = H / 2;
const fctx = fog.getContext('2d');

// =====================================================================
// AUDIO  (everything synthesized with WebAudio)
// =====================================================================
const A = { ctx: null, master: null, music: null, sfx: null, noise: null, amb: null, ambF: null, ambLfo: null, ambLfoG: null, cic: null, cicG: null,
  season: 0, step: 0, nextT: 0, bar: 0, timer: null, duck: 1 };
function initAudio() {
  if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
  try { A.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const c = A.ctx;
  A.master = c.createGain(); A.master.gain.value = 0.9; A.master.connect(c.destination);
  const comp = c.createDynamicsCompressor(); comp.connect(A.master);
  A.music = c.createGain(); A.music.connect(comp);
  A.sfx = c.createGain(); A.sfx.connect(comp);
  applyVolumes();
  const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  A.noise = buf;
  // ambience bed: looping noise through a filter, with an LFO for gusts
  const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
  A.ambF = c.createBiquadFilter(); A.ambF.type = 'bandpass'; A.ambF.frequency.value = 800; A.ambF.Q.value = 0.7;
  A.amb = c.createGain(); A.amb.gain.value = 0;
  src.connect(A.ambF); A.ambF.connect(A.amb); A.amb.connect(A.sfx);
  A.ambLfo = c.createOscillator(); A.ambLfo.frequency.value = 0.15;
  A.ambLfoG = c.createGain(); A.ambLfoG.gain.value = 0;
  A.ambLfo.connect(A.ambLfoG); A.ambLfoG.connect(A.amb.gain);
  const fLfoG = c.createGain(); fLfoG.gain.value = 0; A.fLfoG = fLfoG; A.ambLfo.connect(fLfoG); fLfoG.connect(A.ambF.frequency);
  src.start(); A.ambLfo.start();
  // cicadas for summer
  A.cic = c.createOscillator(); A.cic.type = 'square'; A.cic.frequency.value = 4300;
  const cf = c.createBiquadFilter(); cf.type = 'bandpass'; cf.frequency.value = 4300; cf.Q.value = 8;
  const am = c.createGain(); am.gain.value = 0;
  const amL = c.createOscillator(); amL.frequency.value = 38; const amLG = c.createGain(); amLG.gain.value = 1;
  amL.connect(amLG); amLG.connect(am.gain);
  A.cicG = c.createGain(); A.cicG.gain.value = 0;
  A.cic.connect(cf); cf.connect(am); am.connect(A.cicG); A.cicG.connect(A.sfx);
  A.cic.start(); amL.start();
  A.nextT = c.currentTime + 0.1;
  A.timer = setInterval(scheduleMusic, 40);
  setAmbience(A.season, true);
}
function applyVolumes() {
  if (!A.ctx) return;
  const t = A.ctx.currentTime;
  A.music.gain.setTargetAtTime((settings.music / 10) * 0.55 * A.duck, t, 0.1);
  A.sfx.gain.setTargetAtTime((settings.sfx / 10) * 0.9, t, 0.05);
}
function setAmbience(s, now) {
  A.season = s;
  if (!A.ctx) return;
  const t = A.ctx.currentTime, k = now ? 0.05 : 1.2;
  const cfg = [
    { type: 'highpass', f: 2600, q: 0.4, g: 0.05, lfo: 0.012, ff: 0, cic: 0 },   // spring rain
    { type: 'bandpass', f: 1800, q: 0.6, g: 0.006, lfo: 0.004, ff: 0, cic: 0.012 }, // summer cicadas
    { type: 'bandpass', f: 700, q: 1.1, g: 0.05, lfo: 0.04, ff: 300, cic: 0 },     // fall wind
    { type: 'bandpass', f: 420, q: 4.5, g: 0.06, lfo: 0.05, ff: 220, cic: 0 }      // winter howl
  ][s];
  A.ambF.type = cfg.type;
  A.ambF.frequency.setTargetAtTime(cfg.f, t, k); A.ambF.Q.setTargetAtTime(cfg.q, t, k);
  A.amb.gain.setTargetAtTime(cfg.g, t, k); A.ambLfoG.gain.setTargetAtTime(cfg.lfo, t, k);
  A.fLfoG.gain.setTargetAtTime(cfg.ff, t, k); A.cicG.gain.setTargetAtTime(cfg.cic, t, k);
}
const MUSIC = [
  { bpm: 112, root: 60, scale: [0, 2, 4, 7, 9], chords: [0, 7, 9, 5], inst: 'pluck', density: 0.8, octave: 12 },
  { bpm: 80, root: 57, scale: [0, 2, 4, 6, 7, 9, 11], chords: [0, 2, 0, 7], inst: 'pad', density: 0.35, octave: 12 },
  { bpm: 94, root: 57, scale: [0, 2, 3, 5, 7, 9, 10], chords: [0, 5, 0, 10], inst: 'reed', density: 0.6, octave: 12 },
  { bpm: 62, root: 62, scale: [0, 2, 3, 7, 8], chords: [0, 8, 3, 10], inst: 'bell', density: 0.3, octave: 12 }
];
let musicOn = true, melodyIdx = 2;
function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function scheduleMusic() {
  if (!A.ctx || A.ctx.state !== 'running') return;
  const c = A.ctx;
  while (A.nextT < c.currentTime + 0.25) {
    const m = MUSIC[A.season], stepDur = 60 / m.bpm / 2;
    if (musicOn) playStep(m, A.step, A.nextT, stepDur);
    A.nextT += stepDur; A.step++;
    if (A.step % 8 === 0) A.bar++;
  }
}
function playStep(m, step, t, sd) {
  const barStep = step % 8, chord = m.chords[A.bar % 4];
  const root = m.root + chord;
  if (barStep === 0) {
    voice('bass', mtof(root - 24), t, sd * 7, 0.09);
    if (m.inst === 'pad') { [0, 4, 7].forEach(i => voice('pad', mtof(root + i), t, sd * 8, 0.035)); }
    if (m.inst === 'bell') voice('pad', mtof(root), t, sd * 8, 0.02);
  }
  if (barStep === 4 && m.inst === 'pluck') voice('bass', mtof(root - 17), t, sd * 3, 0.06);
  if (Math.random() < m.density) {
    melodyIdx = clamp(melodyIdx + pick([-2, -1, -1, 0, 1, 1, 2]), 0, m.scale.length * 2 - 1);
    const oct = Math.floor(melodyIdx / m.scale.length), deg = m.scale[melodyIdx % m.scale.length];
    const note = m.root + m.octave + oct * 12 + deg;
    const strong = barStep % 2 === 0;
    voice(m.inst, mtof(note), t, m.inst === 'bell' ? 2.4 : sd * (strong ? 1.8 : 1.1), strong ? 0.07 : 0.05);
  }
}
function voice(kind, f, t, dur, vol) {
  const c = A.ctx, g = c.createGain(), o = c.createOscillator();
  g.connect(A.music);
  if (kind === 'pluck') { o.type = 'triangle'; env(g, t, 0.005, dur, vol); }
  else if (kind === 'pad') { o.type = 'sine'; env(g, t, Math.min(0.6, dur * 0.4), dur, vol); }
  else if (kind === 'bass') { o.type = 'sine'; env(g, t, 0.02, dur, vol); }
  else if (kind === 'reed') {
    o.type = 'sawtooth'; const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100; lp.Q.value = 1;
    o.disconnect(); o.connect(lp); lp.connect(g); env(g, t, 0.03, dur, vol * 0.6);
    o.frequency.value = f; o.start(t); o.stop(t + dur + 0.1); return;
  } else if (kind === 'bell') {
    o.type = 'sine'; env(g, t, 0.004, dur, vol);
    const o2 = c.createOscillator(), g2 = c.createGain(); o2.frequency.value = f * 2.76; o2.connect(g2); g2.connect(A.music);
    env(g2, t, 0.002, dur * 0.4, vol * 0.35); o2.start(t); o2.stop(t + dur);
  }
  o.frequency.value = f; o.connect(g); o.start(t); o.stop(t + dur + 0.1);
}
function env(g, t, a, d, v) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(v, 0.0002), t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
}
function tone(type, f1, f2, dur, vol, delay) {
  if (!A.ctx) return;
  const c = A.ctx, t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  env(g, t, 0.005, dur, vol); o.connect(g); g.connect(A.sfx); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, ftype, f, q, delay, f2) {
  if (!A.ctx) return;
  const c = A.ctx, t = c.currentTime + (delay || 0), s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
  s.buffer = A.noise; fl.type = ftype; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  fl.Q.value = q || 1; env(g, t, 0.004, dur, vol);
  s.connect(fl); fl.connect(g); g.connect(A.sfx); s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
const SFX = {
  pickup() { tone('sine', 660, 990, 0.09, 0.12); tone('sine', 990, 1320, 0.09, 0.08, 0.06); },
  seed() { tone('triangle', 520, 780, 0.08, 0.12); },
  plant() { noise(0.12, 0.2, 'lowpass', 600, 1); tone('sine', 300, 600, 0.25, 0.12, 0.05); },
  fill() { noise(0.3, 0.18, 'bandpass', 900, 2, 0, 400); tone('sine', 220, 440, 0.18, 0.08, 0.05); },
  water() { noise(0.25, 0.14, 'bandpass', 1500, 1.5, 0, 700); tone('sine', 700, 1100, 0.15, 0.06, 0.08); },
  chop() { noise(0.08, 0.35, 'bandpass', 1400, 2); tone('sine', 140, 80, 0.12, 0.25); },
  fell() { noise(0.7, 0.3, 'lowpass', 2000, 0.7, 0, 200); tone('sine', 120, 50, 0.6, 0.25, 0.2); },
  fire() { noise(0.4, 0.25, 'lowpass', 3000, 0.7, 0, 500); for (let i = 0; i < 5; i++) noise(0.03, 0.15, 'highpass', 3000, 1, 0.05 + i * 0.07); },
  eat() { for (let i = 0; i < 3; i++) noise(0.05, 0.22, 'bandpass', 2400, 3, i * 0.09); tone('sine', 500, 700, 0.12, 0.06, 0.3); },
  hurt() { tone('square', 300, 120, 0.22, 0.12); noise(0.15, 0.2, 'lowpass', 800, 1); },
  squeak() { tone('sine', 1400, 2200, 0.08, 0.08); tone('sine', 1800, 1200, 0.1, 0.06, 0.08); },
  howl() { if (!A.ctx) return; const c = A.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain(), v = c.createOscillator(), vg = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(320, t); o.frequency.linearRampToValueAtTime(560, t + 0.6); o.frequency.linearRampToValueAtTime(420, t + 1.8);
    v.frequency.value = 6; vg.gain.value = 9; v.connect(vg); vg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.4); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);
    o.connect(g); g.connect(A.sfx); o.start(t); v.start(t); o.stop(t + 2); v.stop(t + 2); },
  chime(s) { const base = [72, 76, 69, 74][s] || 72; [0, 4, 7, 12].forEach((n, i) => tone('sine', mtof(base + n), 0, 0.9, 0.07, i * 0.09)); },
  tick() { tone('sine', 1600, 0, 0.04, 0.05); },
  crack() { noise(0.12, 0.3, 'highpass', 2500, 1); tone('square', 900, 200, 0.1, 0.05); },
  wither() { tone('triangle', 500, 160, 0.4, 0.09); },
  rot() { noise(0.2, 0.12, 'lowpass', 300, 1); },
  deny() { tone('square', 180, 150, 0.1, 0.06); },
  menu() { tone('triangle', 880, 0, 0.05, 0.06); },
  select() { tone('triangle', 660, 990, 0.1, 0.08); },
  splash() { noise(0.5, 0.35, 'lowpass', 1800, 0.8, 0, 300); tone('sine', 400, 150, 0.3, 0.1); },
  out() { noise(0.6, 0.2, 'lowpass', 800, 0.7, 0, 100); },
  win() { [0, 4, 7, 12, 16, 19, 24].forEach((n, i) => tone('triangle', mtof(60 + n), 0, 0.5, 0.08, i * 0.12)); },
  bark() { tone('square', 520, 260, 0.07, 0.07); noise(0.07, 0.18, 'bandpass', 900, 2); tone('square', 560, 280, 0.07, 0.06, 0.12); noise(0.07, 0.15, 'bandpass', 950, 2, 0.12); },
  whine() { tone('sine', 900, 1300, 0.25, 0.05); tone('sine', 1300, 800, 0.3, 0.04, 0.25); },
  build() { for (let i = 0; i < 3; i++) noise(0.05, 0.25, 'bandpass', 1800, 3, i * 0.11); tone('triangle', 330, 0, 0.12, 0.08, 0.35); },
  warn() { tone('square', 880, 0, 0.09, 0.06); tone('square', 880, 0, 0.09, 0.06, 0.16); tone('square', 1175, 0, 0.14, 0.06, 0.32); },
  caw() { tone('sawtooth', 760, 480, 0.16, 0.06); noise(0.14, 0.12, 'bandpass', 1300, 4); tone('sawtooth', 700, 440, 0.14, 0.05, 0.22); },
  jar() { [72, 76, 79, 84].forEach((n, i) => tone('triangle', mtof(n), 0, 0.5, 0.06, i * 0.07)); tone('sine', mtof(96), 0, 0.8, 0.03, 0.3); },
  purr() { if (!A.ctx) return; for (let i = 0; i < 6; i++) noise(0.09, 0.16, 'lowpass', 160, 2, i * 0.12); tone('sine', 70, 60, 0.8, 0.05); },
  plop() { tone('sine', 520, 180, 0.14, 0.07); noise(0.12, 0.08, 'bandpass', 900, 2, 0.02); },
  memory() { [79, 76, 72, 67].forEach((n, i) => tone('sine', mtof(n), 0, 0.6, 0.05, 0.1 + i * 0.14)); },
  lose() { [12, 7, 3, 0].forEach((n, i) => tone('triangle', mtof(57 + n), 0, 0.7, 0.08, i * 0.25)); }
};

// =====================================================================
// INPUT
// =====================================================================
const down = new Set();

    if ((it.vx || it.vy) && it.type !== 'wood' && it.z < 2 && s !== 3 && inPondShape(it.x, it.y, g.pond * 0.95)) {

    }

      burst(clamp(it.x, 10, W - 10), clamp(it.y, 10, H - 10), it.type === 'fruit' ? UIC().fruit : '#8a5a2b', 6); g.items.splice(i, 1);
    }
